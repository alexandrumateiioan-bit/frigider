<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Rândurile de mai jos fac ca pe iPhone, după „Adaugă pe ecranul principal",
       pagina să se deschidă pe tot ecranul, ca o aplicație. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Frigider">
  <meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <title>Frigiderul nostru</title>
</head>
<body>
  <header class="topbar">
    <h1 id="title">Frigider</h1>
    <span id="mode" class="mode"></span>
  </header>

  <!-- Aici desenează app.js ecranul curent. -->
  <main id="view"><p class="muted center">Se încarcă…</p></main>

  <nav class="tabs" id="tabs">
    <button data-tab="frigider" class="active"><span class="ic">🧊</span>Frigider</button>
    <button data-tab="cumparaturi"><span class="ic">🛒</span>Cumpărături<span class="count" id="shopCount"></span></button>
    <button data-tab="retete"><span class="ic">🍳</span>Rețete</button>
    <button data-tab="setari"><span class="ic">⚙️</span>Setări</button>
  </nav>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
